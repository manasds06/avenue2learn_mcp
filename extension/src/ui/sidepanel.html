<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brightspace Assistant</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Brightspace Assistant</h1>
      <p class="sub">Checkpoint build — tools work, the chat loop is next.</p>
    </header>

    <main>
      <details id="setup" open>
        <summary>Setup</summary>

        <label for="school">Your school</label>
        <select id="school"></select>

        <div id="grant-row" hidden>
          <p class="hint" id="grant-hint"></p>
          <button id="grant" type="button">Allow access</button>
        </div>

        <label for="apikey">Gemini API key</label>
        <div class="key-row">
          <input id="apikey" type="password" autocomplete="off" spellcheck="false"
                 placeholder="AIza…" />
          <button id="save-key" type="button" class="secondary">Save</button>
        </div>
        <p class="hint" id="key-hint"></p>
      </details>

      <hr />

      <label for="tool">Tool</label>
      <select id="tool"></select>
      <p class="hint" id="tool-desc"></p>

      <label for="args">Arguments (JSON)</label>
      <textarea id="args" rows="4" spellcheck="false"></textarea>

      <button id="run" type="button">Run tool</button>

      <div id="status" role="status"></div>
      <pre id="out"></pre>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
