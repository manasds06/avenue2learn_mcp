[project]
name = "avenue-mcp"
version = "0.1.0"
description = "MCP server for McMaster's Avenue to Learn (D2L Brightspace)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # MCP 2.x restructured the SDK: the server class is
    # mcp.server.mcpserver.MCPServer (the old mcp.server.fastmcp.FastMCP path
    # no longer exists). Pinned accordingly.
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "playwright>=1.44",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastembed>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
avenue-mcp = "avenue_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avenue_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
