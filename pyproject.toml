[project]
name = "avenue-mcp"
version = "0.1.0"
description = "MCP server for Avenue to Learn (McMaster's D2L Brightspace instance)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # 2.0 renamed FastMCP -> MCPServer; server.py uses the 2.x API.
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    # Windows ships no system tz database, so zoneinfo cannot resolve
    # America/Toronto without this. Deadline rendering is the headline
    # feature; it must not depend on the host happening to have tzdata.
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Phase 3. Optional because fastembed pulls in onnxruntime, whose wheels lag
# new Python releases — and Phases 1-2 have no use for it. An unsupported
# Python then costs you course-file search, not the whole server.
rag = [
    "fastembed>=0.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
avenue-mcp = "avenue_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avenue_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
